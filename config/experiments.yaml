# Experiment Compositions Registry
experiments:

  btc_rolling_1y:

    environment:
      config: default

    datasets:
      strategy: btcusdt_15m
      execution: btcusdt_1m

    execution:
      config: default

    portfolio:
      config: default

    time:

      mode: rolling

      range:
        start: "2024-01-01T00:00:00Z"
        end: now

      window:
        duration: 1y

      step:
        duration: 1mo

      warmup:
        bars: 200

  btc_fixed_6m:

    environment:
      config: default

    datasets:
      strategy: btcusdt_15m
      execution: btcusdt_1m

    execution:
      config: default

    portfolio:
      config: default

    time:

      mode: fixed

      range:
        start: "2024-01-01T00:00:00Z"
        end: "2024-07-01T00:00:00Z"

      warmup:
        bars: 200
