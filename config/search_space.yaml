# Optuna Optimization Search Space Definition

search_space:
  zone_preset:
    type: "categorical"
    choices:
      - "tier1_only"
      - "tier1_plus_extension"
      - "full_with_harmonic"

  zone_buffer_k:
    type: "float"
    low: 0.1
    high: 1.0
    step: 0.05

  swing_lookback:
    type: "int"
    low: 10
    high: 100
    step: 5

  projection_extension_ratio:
    type: "float"
    low: 0.5
    high: 2.0
    step: 0.1

  stage_timeout_bars:
    type: "int"
    low: 8
    high: 48
    step: 4

  trigger_candle_type:
    type: "categorical"
    choices:
      - "rejection_wick"
      - "engulfing"
      - "any"

  ratchet_activation_trigger:
    type: "categorical"
    choices:
      - "at_target_zone"
      - "at_1R"
      - "at_1.5R"
      - "at_2R"
